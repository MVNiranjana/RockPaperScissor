<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="games.css">
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <a href="snakes.html">🐍 Play Snakes & Ladders</a>
    <button id="muteBtn">🔊 Sound On</button>

    <div class="choices">
        <div id="rock" class="choice" title="Rock">
            <img src="rock.png" alt="Rock">
        </div>
        <div id="paper" class="choice" title="Paper">
            <img src="paper.png" alt="Paper">
        </div>
        <div id="scissor" class="choice" title="Scissors">
            <img src="scissors.png" alt="Scissors">
        </div>
    </div>

    <div class="scoreBoard">
        <div class="score">
            <p id="userScore">0</p>
            <p id="you">You</p>
        </div>
        <div class="score">
            <p id="compScore">0</p>
            <p id="comp">Comp</p>
        </div>
    </div>

    <div class="movesDisplay">
        <div class="moveBox">
            <p class="moveLabel">Your Move</p>
            <div id="userMoveDisplay" class="moveDisplay">
                <p class="placeholder">?</p>
            </div>
        </div>
        <div class="vs">VS</div>
        <div class="moveBox">
            <p class="moveLabel">Computer Move</p>
            <div id="compMoveDisplay" class="moveDisplay">
                <p class="placeholder">?</p>
            </div>
        </div>
    </div>

    <div class="msg">
        <p id="content">Play your Move</p>
    </div>

    <script src="games.js"></script>
    <script src="games.js"></script>
    <script src="games.js"></script>
<script src="sound.js"></script>
</body>
</html>
